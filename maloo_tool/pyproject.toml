[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maloo-tool"
version = "0.1.28"
description = "LLM-agent-focused CLI tool for Maloo test results API"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "LLM Code Tools Team"}
]
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "llm-tool-common",
]

[project.scripts]
maloo = "maloo_tool.cli:main"

[project.urls]
Homepage = "https://github.com/lustre-tools/llm_code_and_review_tools"
Documentation = "https://github.com/lustre-tools/llm_code_and_review_tools/tree/main/maloo_tool"

[tool.setuptools.packages.find]
where = ["."]
# Only the tool itself: an open find also packaged tests/ and any
# build/ left in the tree, which nested a copy per install.
include = ["maloo_tool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: marks tests as integration tests (may require network)",
    "unit: marks tests as unit tests",
    "slow: marks tests as slow-running",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
