[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "release-priority"
version = "0.1.3"
description = "A Lustre release's priority changes in Gerrit, and what an engineer can do to land them"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "LLM Code Tools Team"}
]
# Also requires the `gerrit_cli` Gerrit REST client from this repository,
# installed from a checkout.  It is deliberately NOT listed: an unrelated
# project owns the name "gerrit-cli" on PyPI.
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "llm-tool-common",
]

[project.scripts]
release-priority = "release_priority.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["release_priority*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: marks tests as integration tests (may require network)",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
