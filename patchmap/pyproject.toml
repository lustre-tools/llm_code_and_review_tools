[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchmap"
version = "0.1.0"
description = "Which agent session owns which patch, branch and worktree"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "LLM Code Tools Team"}
]
# Standard library only: it runs in every agent session, on every host.
dependencies = []

[project.scripts]
patchmap = "patchmap.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["patchmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: marks tests as integration tests (may require network)",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
