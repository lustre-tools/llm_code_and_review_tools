[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lreview"
version = "0.2.0"
description = "Run deep AI patch reviews on Gerrit changes and GitHub pull requests"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Claude", email = "claude@anthropic.com"}
]
keywords = ["gerrit", "code-review", "claude", "lustre", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "gerrit-cli",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
lreview = "lreview.cli:main"

[tool.setuptools.packages.find]
include = ["lreview*"]

[tool.setuptools.package-data]
lreview = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["lreview/tests"]
addopts = "--strict-markers"
markers = [
    "integration: marks tests as integration tests (may require network)",
    "unit: marks tests as unit tests",
]
