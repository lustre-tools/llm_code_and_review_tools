[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pw-cli"
version = "0.1.2"
description = "Ask Patch Watcher for what tagging it on a Gerrit change asks, signed in with a Gerrit login"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "LLM Code Tools Team"}
]
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "llm-tool-common",
]

[project.scripts]
pw-cli = "pw_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pw_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: marks tests as integration tests (may require network)",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]
