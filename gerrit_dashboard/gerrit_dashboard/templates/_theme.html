{% include "_display_head.html" %}
{% if static_mode %}
<style>{{ tlc_inline().css | safe }}</style>
{% else %}
<link rel="stylesheet" href="{{ url_for('static', filename='tlc/css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='tlc/css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='tlc/css/components.css') }}">
{% endif %}
<style>
  /* Shared by every page; colours only from --tlc-* tokens. */
  body { font-size: var(--tlc-text-sm); line-height: var(--tlc-leading-dense); }
  .wrap { max-width: 1560px; margin: 0 auto; padding: var(--tlc-space-4) var(--tlc-space-5) var(--tlc-space-7); }
  @media (max-width: 40rem) { .wrap { padding-inline: var(--tlc-space-4); } }
  .gd-topbar { gap: var(--tlc-space-2) var(--tlc-space-4); }
  .gd-topbar .ident { color: var(--tlc-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .gd-topbar .right { display: flex; align-items: center; flex-wrap: wrap; gap: var(--tlc-space-2) var(--tlc-space-3); margin-left: auto; }
  a.site-home { font-weight: 700; color: var(--tlc-text); text-decoration: none; }
  a.site-home:hover { color: var(--tlc-accent); text-decoration: underline; }
  .crumb-sep { color: var(--tlc-muted); }
  label.ctl { display: inline-flex; align-items: center; gap: var(--tlc-space-2); color: var(--tlc-text-2); white-space: nowrap; cursor: pointer; }
  h1.gd-title { font-size: var(--tlc-text-xl); margin: 0 0 var(--tlc-space-4); }
  h1.gd-title small { font-family: var(--tlc-font); font-weight: 400; font-size: var(--tlc-text-md); color: var(--tlc-muted); margin-left: var(--tlc-space-2); }
  .hidden { display: none !important; }

  /* Smallest text: one step below TLC's Small, wins over any TLC size. */
  html:root[data-gd-size="xs"] { font-size: 87.5%; }
  /* Classic font: the system stack the dashboard used before TLC. */
  html[data-gd-font="classic"] {
    --tlc-font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --tlc-display: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --tlc-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  /* Header title when TLC branding is off. */
  .gd-brand { font-weight: 700; font-size: var(--tlc-text-lg); color: var(--tlc-text);
              text-decoration: none; white-space: nowrap; }
  a.gd-brand:hover { color: var(--tlc-accent); text-decoration: none; }
  footer.gd-foot .gd-version { white-space: nowrap; }
</style>
